<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.scripte Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
    <style>
        body { background-color: #1e1e1e; color: white; font-family: Arial, sans-serif; }
        #editor { width: 100%; height: 300px; border: 1px solid #444; }
        #run { margin: 10px 0; padding: 10px; background: #007acc; color: white; border: none; cursor: pointer; }
        #console { background: black; color: lime; padding: 10px; height: 200px; overflow-y: auto; border: 1px solid #444; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>M.scripte Online</h1>
    <textarea id="editor"></textarea>
    <button id="run">Run</button>
    <pre id="console"></pre>
    
    <script>
        let editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
            mode: "javascript", theme: "monokai", lineNumbers: true
        });

        function captureConsole() {
            let consoleOutput = document.getElementById("console");
            consoleOutput.textContent = ""; // Clear console before running
            
            let originalLog = console.log;
            console.log = function(...args) {
                consoleOutput.textContent += args.join(" ") + "\n";
                originalLog.apply(console, args);
            };
        }

        function runCode() {
            captureConsole();
            let code = editor.getValue();
            
            try {
                new Function(code)(); // Execute the code safely
            } catch (error) {
                console.log("Error:", error);
            }
        }
        
        document.getElementById("run").addEventListener("click", runCode);
    </script>
</body>
</html>
